services:
  mysql:
    image: mysql:8.4
    container_name: certpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-certpilot_dev}
      MYSQL_DATABASE: certpilot
    ports:
      - "3306:3306"
    volumes:
      - certpilot_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  certpilot_mysql_data:
